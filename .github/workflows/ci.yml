name: CI
on:
    push:
        branches: [main, development]
    pull_request:
jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 'lts/*'
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Run CI checks
              run: npm run ci:check
